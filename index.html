<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>4x4 Tally Match</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="game-container">
    <div class="scoreboard">
      <div class="score red">Red: <span id="red-score">0</span></div>
      <div id="status">Red's Turn</div>
      <div class="score blue">Blue: <span id="blue-score">0</span></div>
    </div>

    <div id="board" class="board"></div>

    <div class="controls">
      <button id="reset-btn">New Game</button>
    </div>
  </div>
  <script src="js/script.js"></script>
</body>
</html>
